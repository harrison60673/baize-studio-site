/* Matrix edition: restore the original terminal atmosphere across the flow. */
:root,
body[data-theme="dark"],
body[data-theme="light"] {
  --paper: #020a05;
  --surface: #06180d;
  --ink: #d8ffe6;
  --muted: #89b59a;
  --line: #174a2b;
  --green: #00ff66;
  --bright: #7dffa8;
  --sans: "SFMono-Regular", "PingFang TC", "Microsoft JhengHei", monospace;
  --serif: "SFMono-Regular", "PingFang TC", "Microsoft JhengHei", monospace;
  color-scheme: dark;
}
body {
  background: #020a05;
  color: var(--ink);
  font-family: var(--sans);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, #00000015 0 1px, transparent 1px 4px);
}
::selection { background: #00ff66; color: #02140a; }
.matrix-backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: .4;
  mask-image: linear-gradient(90deg, #000 0%, #0006 44%, #000 100%);

body[data-step="4"] .matrix-backdrop,
body[data-step="5"] .matrix-backdrop { opacity: .22; }
.masthead, .flow-nav, main, .site-footer { position: relative; z-index: 1; }
.masthead {
  border-bottom-color: #00ff6638;
  background: #020a05b8;
}
.wordmark { color: #7dffa8; }
.brand-mark { filter: drop-shadow(0 0 7px #00ff6644); }
.masthead-caption { color: #85b496; }
.edition { color: #a1e7b7; }
.status-dot { width: 6px; height: 6px; background: #00ff66; box-shadow: 0 0 10px #00ff6699; }

    return '<div class="fx-demo fx-' + id + '" data-fx="' + id + '" tabindex="0" role="button" aria-label="預覽' + item.name + '，可點擊或按 Enter 重播">' + contents[id] + '</div>';
  }

  const mounted = new WeakSet();

  function mount(root) {
    const hosts = Array.from(root.querySelectorAll('.fx-demo[data-fx]'));
    if (root.matches && root.matches('.fx-demo[data-fx]')) hosts.unshift(root);
    const cleanups = [];
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    hosts.forEach(host => {
      if (mounted.has(host)) return;
      mounted.add(host);
      const id = host.dataset.fx;
      const button = host.querySelector('.fx-magnetic-button');
      const removers = [];
      const timers = new Set();
      let frame = 0;
      const later = (callback, delay) => {
        const timer = window.setTimeout(() => { timers.delete(timer); callback(); }, delay);
        timers.add(timer);
        return timer;
      };
      const on = (name, handler) => { host.addEventListener(name, handler); removers.push(() => host.removeEventListener(name, handler)); };

      function position(event) {
        const bounds = host.getBoundingClientRect();
        const x = event && Number.isFinite(event.clientX) ? event.clientX - bounds.left : bounds.width / 2;
        const y = event && Number.isFinite(event.clientY) ? event.clientY - bounds.top : bounds.height / 2;
        return { x, y, width: bounds.width, height: bounds.height };
      }

      function move(event) {
        const p = position(event);
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          host.style.setProperty('--fx-x', p.x + 'px');
          host.style.setProperty('--fx-y', p.y + 'px');
          if (id === 'spotlight') {
            const card = host.querySelector('.fx-spotlight-card');
            if (card) {
              host.style.setProperty('--fx-card-x', (p.x - card.offsetLeft) + 'px');
              host.style.setProperty('--fx-card-y', (p.y - card.offsetTop) + 'px');
            }
          }
          if (id === 'magnetic' && button && !reduceMotion) {
            const dx = Math.max(-12, Math.min(12, (p.x - p.width / 2) * 0.12));
            const dy = Math.max(-8, Math.min(8, (p.y - p.height / 2) * 0.12));
            button.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
          }
        });
      }

      function replay() {
        if (reduceMotion) return;
        host.classList.remove('fx-replay');
        void host.offsetWidth;
        host.classList.add('fx-replay');
      }

      function activate(event) {
        host.classList.add('fx-active');
        move(event);
        if (id === 'blur-fade') replay();
      }

      function reset() {
        host.classList.remove('fx-active');
        if (button) button.style.transform = '';
      }

      function trigger(event) {
        activate(event);
        if (id === 'ripple') {
          const p = position(event);
          const pulse = document.createElement('span');
          pulse.className = 'fx-pulse';
          pulse.style.left = p.x + 'px';
          pulse.style.top = p.y + 'px';
          host.appendChild(pulse);
          later(() => pulse.remove(), reduceMotion ? 200 : 1300);
        }
        if (id === 'magnetic' && button && !reduceMotion && (!event || event.type === 'keydown')) {
          button.style.transform = 'translate(7px,-3px)';
        }
        later(() => {
          if (!host.matches(':hover') && document.activeElement !== host) reset();
          if (id === 'magnetic' && button) button.style.transform = '';
        }, 1400);
      }

      on('pointerenter', activate);
      on('pointermove', move);
      on('pointerleave', reset);
      on('focus', () => activate());
      on('blur', reset);
      on('click', trigger);
      on('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        trigger(event);
      });
      cleanups.push(() => {
        removers.forEach(remove => remove());
        timers.forEach(clearTimeout);
        cancelAnimationFrame(frame);
        host.querySelectorAll('.fx-pulse').forEach(pulse => pulse.remove());
        host.classList.remove('fx-active', 'fx-replay');
        if (button) button.style.transform = '';
        mounted.delete(host);
      });
    });
    return () => cleanups.forEach(cleanup => cleanup());
  }

  window.BaizeEffects = { catalog, markup, mount };
}());

<script>
(function () {
  'use strict';
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function runtime(config) {
    const site = document.getElementById('sample-site');
    const dialog = document.getElementById('demo-feature');
    let trigger = null;
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action="feature"]');
      if (!target) return;
      event.preventDefault();
      const feature = config.features[Number(target.dataset.feature)];
      if (!feature) return;
      trigger = target;
      dialog.querySelector('h2').textContent = feature.name;
      const list = dialog.querySelector('ol'); list.replaceChildren();
      feature.items.forEach(item => {
        const row = document.createElement('li');
        const title = document.createElement('strong'); title.textContent = item.name;
        const detail = document.createElement('p'); detail.textContent = item.desc;
        row.append(title, detail); list.append(row);
      });
      dialog.showModal();
    });
    document.addEventListener('keydown', event => {
      const target = event.target.closest('[role="button"][data-action="feature"]');
      if (target && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); target.click(); }
    });
    dialog.addEventListener('close', () => trigger?.focus({preventScroll:true}));
    dialog.addEventListener('click', event => { if(event.target === dialog) {const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();} });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (config.effects.includes('blur-fade')) site.classList.add('site-fade');
    if (config.effects.includes('border-beam')) site.classList.add('site-beam');
    if (config.effects.includes('spotlight')) site.querySelectorAll('.sample-card').forEach(card => {
      card.classList.add('site-spotlight'); card.addEventListener('pointermove', event => {const r=card.getBoundingClientRect();card.style.setProperty('--sx',event.clientX-r.left+'px');card.style.setProperty('--sy',event.clientY-r.top+'px');});
    });
    const cta=site.querySelector('.sample-cta');
    if(cta && config.effects.includes('magnetic') && !reduce){cta.addEventListener('pointermove',event=>{const r=cta.getBoundingClientRect();cta.style.transform=`translate(${(event.clientX-r.left-r.width/2)*.12}px,${(event.clientY-r.top-r.height/2)*.12}px)`;});cta.addEventListener('pointerleave',()=>{cta.style.transform='';});}
    const art=site.querySelector('.sample-art');
    if(art && config.effects.includes('ripple'))art.addEventListener('pointerdown',event=>{const r=art.getBoundingClientRect(),pulse=document.createElement('span');pulse.className='site-ripple';pulse.style.left=event.clientX-r.left+'px';pulse.style.top=event.clientY-r.top+'px';art.append(pulse);setTimeout(()=>pulse.remove(),1200);});
    if(art && config.effects.includes('xray')){const reveal=document.createElement('div');reveal.className='site-xray';reveal.setAttribute('aria-hidden','true');reveal.innerHTML=art.innerHTML;art.append(reveal);art.addEventListener('pointermove',event=>{const r=art.getBoundingClientRect();art.style.setProperty('--sx',event.clientX-r.left+'px');art.style.setProperty('--sy',event.clientY-r.top+'px');art.classList.add('xray-active');});art.addEventListener('pointerleave',()=>art.classList.remove('xray-active'));}
  }
  function build(config) {
    const data = JSON.stringify({features:config.features,effects:config.effects || []}).replace(/</g,'\\u003c');
    const background = config.templateId === 'matrix' ? '#020a05' : config.templateId === 'ocean' ? '#071a2b' : '#f3f0e8';
    const extras = `html{scroll-behavior:smooth}body{margin:0;background:${background};padding:0;color-scheme:normal}body::after{display:none}.standalone-demo{width:100%;max-width:1600px;margin:auto;min-height:100vh}.standalone-demo>.sample-site,.standalone-demo>.website-template{width:100%;min-height:100vh}.site-demo-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#07120c;color:#acddba;padding:10px 4%;font:10px/1.6 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;border-bottom:1px solid #1f4830}.site-demo-bar strong{color:#7dffa8;font-weight:500}.site-demo-bar span:last-child{font-size:9px;opacity:.75}.standalone-demo .hotspot-pulse{animation:none;opacity:.16}.standalone-demo .hotspot-badge{width:20px;height:20px;font-size:15px;right:-6px;top:-8px}#demo-feature{width:min(520px,calc(100% - 32px));max-height:85dvh;border:1px solid #46845b;background:#07190d;color:#e1f5e7;padding:27px;font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;box-shadow:0 25px 90px #0008}#demo-feature::backdrop{background:#000a}#demo-feature h2{font-size:25px;margin:0 0 18px}#demo-feature>p{font-size:11px;color:#93bf9f;margin-bottom:20px}#demo-feature ol{padding-left:22px}#demo-feature li{padding:10px 0}#demo-feature li strong{font-size:14px;font-weight:500;color:#b9f1c8}#demo-feature li p{font-size:12px;color:#b4ceb9;margin:5px 0}#demo-feature form{text-align:right;margin-top:20px}#demo-feature button{border:1px solid #00ff66;color:#05240e;background:#00ff66;min-height:38px;padding:0 22px;font:12px inherit;cursor:pointer}@media(max-width:600px){.site-demo-bar{align-items:flex-start;flex-direction:column;gap:3px}.standalone-demo{overflow-x:clip}}`;
    return '<!doctype html>\n<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+escape(config.client)+' — '+escape(config.templateName)+' Demo</title><style>'+config.css+'\n'+extras+'</style></head><body><div class="site-demo-bar"><strong>'+escape(config.client)+' / '+escape(config.templateName)+'</strong><span>套版生成示範 · 點擊 ＋ 查看功能 · 不會送出資料或付款</span></div><main class="standalone-demo">'+config.html+'</main><dialog id="demo-feature" aria-labelledby="demo-feature-title"><h2 id="demo-feature-title"></h2><p>這是功能示意。實作前可一起確認以下需求：</p><ol></ol><form method="dialog"><button>返回網站</button></form></dialog><script>('+runtime.toString()+')('+data+');<\/script></body></html>';
  }
  function download(config) {
    const url=URL.createObjectURL(new Blob([build(config)],{type:'text/html;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download=(config.client.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'').slice(0,45)||'網站')+'-'+config.templateName+'-Demo.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  }
  window.BaizeDemoExport={build,download};
}());

</script>

<script>
(function () {
  'use strict';

  const fallbackEscape = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const priorityLabels = { discuss: '討論優先', later: '後續階段', out: '暫不列入' };
  const noteFields = [
    { id: 'general', label: '客戶補充／現場說明', placeholder: '記錄客戶實際怎麼說、現有做法與想改善的事。' },
    { id: 'priority', label: '本次優先討論', placeholder: '哪些事情最影響目前營運？希望先解決什麼？' },
    { id: 'exclusions', label: '暫不包含／後續階段', placeholder: '哪些需求先不討論，或可以等下一階段再評估？' },
    { id: 'timing', label: '時程、預算與上線期待', placeholder: '記錄客戶的期待與限制，交由工程師評估可行範圍。' },
    { id: 'engineering', label: '交工程師前的問題', placeholder: '還缺哪些資料、有哪些疑問或已知依賴需要工程師協助？' }
  ];

  function model(ctx) {
    const source = window.BaizeSpecData;
    if (!source) throw new Error('BaizeSpecData must load before the sales specification renderer.');
    const profile = source.profiles[ctx.caseId] || source.profiles.fitness;
    const sections = source.sections;
    const active = sections.some(section => section.id === ctx.activeSection) ? ctx.activeSection : sections[0].id;
    return {
      ...ctx,
      escape: ctx.escape || fallbackEscape,
      source,
      profile,
      sections,
      active,
      features: Array.isArray(ctx.features) ? ctx.features : [],
      effects: Array.isArray(ctx.effects) ? ctx.effects : [],
      notes: { general: '', priority: '', exclusions: '', timing: '', engineering: '', ...(ctx.notes || {}), modules: ctx.notes?.modules || {} },
      template: ctx.template || { id: 'matrix', name: '駭客任務', english: 'MATRIX / SYSTEM', description: '' },
      subtotal: Number(ctx.subtotal) || 0
    };
  }

  function status(text, type = 'pending') {
    return `<span class="spec-status is-${type}">${fallbackEscape(text)}</span>`;
  }

  function sectionHeading(index, title, subtitle, tag = '待訪談') {
    return `<div class="spec-section-head"><div><span class="spec-section-number">${String(index + 1).padStart(2, '0')} / DISCUSSION</span><h2>${fallbackEscape(title)}</h2>${subtitle ? `<p class="spec-section-subtitle">${fallbackEscape(subtitle)}</p>` : ''}</div>${tag ? status(tag, tag === '工程師評估' ? 'engineering' : tag === '本次展示選擇' || tag === '預設示例' ? 'demo' : 'pending') : ''}</div>`;
  }

  function table(headings, rows, caption) {
    return `<div class="spec-table-wrap"><table class="spec-table">${caption ? `<caption>${fallbackEscape(caption)}</caption>` : ''}<thead><tr>${headings.map(heading => `<th scope="col">${fallbackEscape(heading)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  function noteInput(m, field, extraClass = '') {
    const e = m.escape;
    const value = String(m.notes[field.id] || '');
    return `<div class="spec-note-field ${extraClass}"><label for="spec-note-${field.id}">${e(field.label)}</label><textarea id="spec-note-${field.id}" data-spec-field="${field.id}" maxlength="2000" rows="3" placeholder="${e(field.placeholder)}">${e(value)}</textarea><p class="spec-note-readonly" data-spec-readonly-field="${field.id}">${value.trim() ? e(value) : '尚未記錄'}</p></div>`;
  }

  function render(ctx) {
    const m = model(ctx), e = m.escape;
    const total = m.features.reduce((sum, feature) => sum + feature.items.length, 0);
    const activeIndex = m.sections.findIndex(section => section.id === m.active);
    const body = {
      overview: renderOverview(m, total),
      journey: renderJourney(m),
      functional: renderFunctional(m),
      data: renderData(m),
      quality: renderQuality(m),
      visual: renderVisual(m),
      notes: renderNotes(m),
      handoff: renderHandoff(m)
    };
    return `<section class="sales-spec${m.presentation ? ' is-presenting' : ''}" aria-labelledby="summary-title">
      <header class="spec-hero"><div><span class="eyebrow">05 / DISCOVERY SPECIFICATION DRAFT</span><h1 id="summary-title">需求探索總結</h1><p>${e(m.specIntro || '把展示畫面整理成可討論的規格草案，供業務逐節說明、訪談與記錄。')}</p></div><div class="spec-document-meta"><strong>DEMO / V0.1</strong>${m.presentationName ? `<span>展示版本：${e(m.presentationName)}</span>` : ''}<span>${e(m.client)} · ${e(m.caseLabel)}</span>${status('尚未工程評估', 'engineering')}</div></header>
      <div class="spec-boundary" role="note"><strong>展示與討論用草案</strong><p>${e(m.source.boundary)}</p></div>
      <div class="spec-toolbar"><div class="button-row"><button type="button" class="primary" data-action="spec-presentation" aria-pressed="${Boolean(m.presentation)}">${m.presentation ? '返回完整草案' : '業務展示模式'} <span aria-hidden="true">↗</span></button><button type="button" class="secondary" data-action="download">匯出交接草案 ↓</button><button type="button" class="secondary" data-action="spec-export-html">匯出展示文件 ↓</button><button type="button" class="text-button" data-action="download-demo" data-template="${e(m.template.id)}">下載網站 Demo ↓</button></div><span class="spec-save-status" role="status" aria-live="polite">筆記保存在此瀏覽器</span></div>
      <div class="spec-legend" aria-label="草案狀態說明">${status('預設示例', 'demo')}<span>供說明，尚未定案</span>${status('待訪談')}<span>由業務記錄客戶需求</span>${status('工程師評估', 'engineering')}<span>確認做法、範圍與可行性</span></div>
      <div class="spec-layout"><nav class="spec-nav" aria-label="規格草案章節"><span class="spec-nav-label">DISCUSSION INDEX</span>${m.sections.map((section, index) => `<button type="button" data-action="spec-section" data-section="${e(section.id)}"${section.id === m.active ? ' aria-current="location"' : ''}><span>${String(index + 1).padStart(2, '0')}</span><strong>${e(section.short || section.title)}</strong></button>`).join('')}<p>目前進度：需求展示與整理。<br>工程結論由工程師評估後補齊。</p></nav>
      <div class="spec-content">${m.sections.map((section, index) => `<section class="spec-section" id="spec-${e(section.id)}" data-spec-section="${e(section.id)}" aria-labelledby="spec-title-${e(section.id)}"${m.presentation && section.id !== m.active ? ' hidden' : ''}><div id="spec-title-${e(section.id)}">${sectionHeading(index, section.title, sectionSubtitle(section.id), sectionStatus(section.id))}</div>${body[section.id] || ''}</section>`).join('')}
      <div class="spec-pager"${m.presentation ? '' : ' hidden'}><button type="button" class="secondary" data-action="spec-prev"${activeIndex === 0 ? ' disabled' : ''}>← 上一節</button><span data-spec-page>${String(activeIndex + 1).padStart(2, '0')} / ${String(m.sections.length).padStart(2, '0')}</span><button type="button" class="primary" data-action="spec-next"${activeIndex === m.sections.length - 1 ? ' disabled' : ''}>下一節 →</button></div>
      <p class="spec-footer-note">此頁及匯出文件皆為 Demo 訪談草案。業務記錄與畫面選擇供工程師評估使用；最終實作、交付範圍、時程與正式費用，仍需工程師評估後確認。</p></div></div>
    </section>`;
  }

  function sectionSubtitle(id) {
    return {
      overview: '先說明客戶想改善的事，以及本次展示涵蓋哪些方向。',
      journey: '讓客戶用自己的工作方式，描述誰會使用、先做什麼、接著做什麼。',
      functional: '將四個畫面功能展開成訪談項目；每一列都保留說明與確認空間。',
      data: '先辨認資料來源與可能的外部服務，再由工程師確認串接方式。',
      quality: '用正常操作、例外情境與交付問題，補上畫面看不到的需求。',
      visual: '記錄本次展示選擇與效果示意費，供後續評估參考。',
      notes: '記錄客戶原話、優先事項與尚未釐清的問題，不必先替工程做結論。',
      handoff: '整理要交給工程師判斷的事項，再確認可行範圍與正式估價。'
    }[id] || '';
  }

  function sectionStatus(id) {
    return id === 'visual' ? '本次展示選擇' : id === 'quality' || id === 'journey' ? '預設示例' : id === 'handoff' ? '工程師評估' : '待訪談';
  }

  function renderOverview(m, total) {
    const e = m.escape;
    return `<div class="spec-facts"><div class="spec-stat"><strong>${m.features.length}</strong><span>核心功能方向</span></div><div class="spec-stat"><strong>${total}</strong><span>待釐清問題</span></div><div class="spec-stat"><strong>${m.effects.length}</strong><span>本次選購效果</span></div><div class="spec-stat"><strong>${m.sections.length}</strong><span>討論章節</span></div></div>
      <div class="spec-two-col"><article class="spec-card"><div class="spec-card-heading"><h3>客戶原始描述</h3><button type="button" class="text-button" data-action="navigate" data-step="1">修改 ↗</button></div><p class="spec-verbatim">${e(m.need)}</p><div class="spec-project-label">${e(m.client)} / ${e(m.caseLabel)}</div></article><article class="spec-card"><div class="spec-card-heading"><h3>案型展示目標</h3>${status('預設示例', 'demo')}</div><p>${e(m.profile.objective)}</p><p class="spec-muted">請先請客戶補充：這是否符合目前最想解決的問題？還有哪些既有流程或限制？</p></article></div>
      <div class="spec-card spec-overview-note"><h3>本次可以先聊到哪裡</h3><p>業務可依此草案說明使用情境、功能方向、畫面風格與需要準備的資料。各項功能目前都是討論起點，仍待訪談釐清及工程師評估。</p></div>`;
  }

  function renderJourney(m) {
    const e = m.escape;
    return `<h3 class="spec-subheading">角色與權限範圍</h3><div class="spec-role-grid">${m.profile.roles.map(role => `<article class="spec-role"><h4>${e(role.name)}</h4><p>${e(role.purpose)}</p><div class="spec-role-question"><span>需要確認</span><p>${e(role.permissionQuestion)}</p></div></article>`).join('')}</div><h3 class="spec-subheading">主要操作流程示例</h3>${m.profile.journeys.map((journey, index) => `<article class="spec-flow"><div class="spec-card-heading"><h4>${String(index + 1).padStart(2, '0')} / ${e(journey.title)}</h4>${status('流程待確認')}</div><ol class="spec-flow-steps">${journey.steps.map((step, index) => `<li><span>${String(index + 1).padStart(2, '0')}</span><p>${e(step)}</p></li>`).join('')}</ol><p class="spec-flow-exception"><strong>接著可以問：</strong>${e(journey.exception)}</p></article>`).join('')}`;
  }

  function renderFunctional(m) {
    const e = m.escape;
    return `<p class="spec-muted">展示順序標記只用來協助討論；「暫不列入」也需要後續確認，尚未構成正式開發範圍。</p>${m.features.map((feature, index) => {
      const id = `F${String(index + 1).padStart(2, '0')}`;
      const notes = m.notes.modules[String(index)] || {};
      const priority = priorityLabels[notes.priority] ? notes.priority : 'discuss';
      const note = String(notes.note || '');
      return `<article class="spec-module"><div class="spec-module-head"><div><span class="spec-module-code">${id}</span><h3>${e(feature.name)}</h3><span class="spec-muted">${feature.items.length} 個待釐清項目</span></div><div class="spec-module-priority"><label for="spec-priority-${index}">本次討論標記</label><select id="spec-priority-${index}" data-spec-module="${index}" data-spec-module-field="priority">${Object.entries(priorityLabels).map(([key, label]) => `<option value="${key}"${priority === key ? ' selected' : ''}>${label}</option>`).join('')}</select><span class="spec-choice-readonly" data-spec-readonly-module="${index}" data-spec-readonly-module-field="priority">${priorityLabels[priority]}</span></div></div><p class="spec-module-prompt"><strong>說明起點：</strong>${e(m.profile.modulePrompts[index] || '先請客戶描述目前怎麼做，以及最希望改善的事。')}</p>${table(['編號', '規格項目與待確認問題', '狀態'], feature.items.map((item, itemIndex) => [`<span class="spec-requirement-id">${id}.${String(itemIndex + 1).padStart(2, '0')}</span>`, `<strong>${e(item.name)}</strong><p>${e(item.desc)}</p>`, status('待釐清')]))}<div class="spec-note-field"><label for="spec-module-note-${index}">業務補充／${e(feature.name)}</label><textarea id="spec-module-note-${index}" data-spec-module="${index}" data-spec-module-field="note" maxlength="2000" rows="2" placeholder="可記錄客戶原話、現行做法或需要工程師協助釐清的細節。">${e(note)}</textarea><p class="spec-note-readonly" data-spec-readonly-module="${index}" data-spec-readonly-module-field="note">${note.trim() ? e(note) : '尚未記錄'}</p></div></article>`;
    }).join('')}`;
  }

  function renderData(m) {
    const e = m.escape;
    return `<h3 class="spec-subheading">需要管理哪些資料</h3>${table(['資料類別', '可能包含的內容', '訪談時要確認'], m.profile.entities.map(entity => [`<strong>${e(entity.name)}</strong>`, e(entity.examples), e(entity.question)]), '資料範圍草案，尚未決定資料欄位與保存方式')}<h3 class="spec-subheading">候選外部服務與系統串接</h3><p class="spec-muted">以下先列為是否需要的討論選項；供應商、方案、費用、資料交換方式與責任範圍均未確認。</p>${table(['候選服務', '用途方向', '仍需確認'], m.profile.integrations.map(integration => [`<strong>${e(integration.name)}</strong>`, e(integration.purpose), e(integration.question)]))}`;
  }

  function renderQuality(m) {
    const e = m.escape;
    return `<h3 class="spec-subheading">操作例外也需要先討論</h3>${table(['例外情境', '可能影響', '說明與待確認'], m.profile.exceptions.map(item => [`<strong>${e(item.scenario)}</strong>`, e(item.impact), e(item.discussion)]))}<h3 class="spec-subheading">驗收情境示例</h3><p class="spec-muted">以下協助業務說明「怎樣算是可以使用」。正式測試條件、測試資料與驗收標準，仍需工程師整理後確認。</p>${table(['情境', '操作示例', '預期方向（示例）'], m.profile.acceptance.map(item => [`<strong>${e(item.scenario)}</strong>`, e(item.action), e(item.expected)]))}<h3 class="spec-subheading">交付與維運的討論範圍</h3><div class="spec-two-col">${m.profile.delivery.map(item => `<article class="spec-card"><div class="spec-card-heading"><h4>${e(item.item)}</h4>${status('工程師確認', 'engineering')}</div><p>${e(item.discussion)}</p></article>`).join('')}</div>`;
  }

  function renderVisual(m) {
    const e = m.escape;
    return `<article class="spec-card"><div class="spec-card-heading"><h3>選用的網站展示方向</h3><button type="button" class="text-button" data-action="navigate" data-step="3">更換套版 ↗</button></div><div class="spec-template-choice"><strong>${e(m.template.name)}</strong><span>${e(m.template.english)}</span></div><p>${e(m.template.description)}</p><p class="spec-muted">這是本次展示選擇。頁面、互動強度與實際內容還可再討論。</p></article><h3 class="spec-subheading">可選視覺效果</h3>${m.effects.length ? table(['效果', '適用方向', '示意整合費'], m.effects.map(effect => [`<strong>${e(effect.name)}</strong>`, e(effect.target), `<span class="spec-price">NT$ ${Number(effect.price).toLocaleString('zh-TW')}</span>`])) : '<p class="spec-card">本次未選購額外視覺效果，先以基本版型討論。</p>'}<div class="spec-fee-total"><span>效果示意小計</span><strong><small>NT$</small> ${m.subtotal.toLocaleString('zh-TW')}</strong><button type="button" class="text-button" data-action="navigate" data-step="4">調整效果 ↗</button></div><div class="spec-quote-scope">${table(['評估項目', '目前狀態'], [['網站與系統開發範圍', status('工程師評估', 'engineering')], ['第三方服務、素材與維運費用', status('需求釐清後確認')], ['正式費用、交付方式與時程', status('尚未估價', 'engineering')]])}</div><p class="spec-footer-note">效果金額為 Demo 的一次性整合費示意，並非整站總價或正式報價。本頁的選用及討論記錄不會產生訂單或扣款。</p>`;
  }

  function renderNotes(m) {
    return `<p class="spec-present-intro">業務可以先記錄客戶的期待與目前做法，將不確定的地方留給後續評估。筆記只保存在目前瀏覽器，匯出草案時會一併帶出。</p><div class="spec-field-grid">${noteFields.map((field, index) => noteInput(m, field, index === 0 ? 'spec-field-full' : '')).join('')}</div>`;
  }

  function renderHandoff(m) {
    const e = m.escape;
    const handoffSteps = ['展示與需求探索', '業務整理訪談記錄', '工程師評估與釐清', '確認範圍與正式估價'];
    return `<div class="spec-handoff-status">${status('尚未工程評估', 'engineering')}<p>目前資料供工程師了解需求方向，技術做法與可交付範圍仍待評估。</p></div><ol class="spec-handoff-flow">${handoffSteps.map((step, index) => `<li><span>${String(index + 1).padStart(2, '0')}</span><strong>${step}</strong></li>`).join('')}</ol><h3 class="spec-subheading">請工程師接續確認</h3><ul class="spec-checklist">${m.profile.engineeringChecks.map((item, index) => `<li><span aria-hidden="true">${String(index + 1).padStart(2, '0')}</span><p>${e(item)}</p></li>`).join('')}</ul><div class="spec-two-col"><article class="spec-card"><h3>業務可先整理</h3><p>客戶目的、現行流程、優先事項、內容素材、既有系統，以及對時程與預算的期待。</p></article><article class="spec-card"><h3>工程師接續評估</h3><p>功能與資料規則、權限、系統串接、操作例外、測試方式、實作範圍、可行時程及正式費用。</p></article></div><p class="spec-footer-note">最終以工程師評估後的規格與估價為主，並與客戶確認實際範圍；此 Demo 不代表工程已承諾或核定。</p>`;
  }

  function markdown(ctx) {
    const m = model(ctx);
    const total = m.features.reduce((sum, feature) => sum + feature.items.length, 0);
    const lines = [`# ${m.client}｜需求探索規格草案`, '', '**DEMO / V0.1｜展示與討論用｜尚未工程評估**', '', m.source.boundary, '', `案型：${m.caseLabel}`, ...(m.presentationName ? [`展示版本：${m.presentationName}`] : []), `本次展示套版：${m.template.name} / ${m.template.english}`, `討論方向：${m.features.length} 項核心功能、${total} 個待釐清問題、${m.effects.length} 項選購效果。`, ''];
    const section = (number, title) => lines.push(`## ${String(number).padStart(2, '0')} / ${title}`, '');
    const notes = (label, value) => { lines.push(`**${label}**`, ''); if (String(value || '').trim()) lines.push(...String(value).split('\n').map(line => '> ' + line)); else lines.push('尚未記錄。'); lines.push(''); };

    section(1, '專案目標');
    lines.push('### 客戶原始描述', '', ...String(m.need || '').split('\n').map(line => '> ' + line), '', '### 案型展示目標（預設示例）', '', m.profile.objective, '', '本次功能與流程為討論起點，仍待訪談釐清及工程師評估。', '');
    section(2, '角色與流程');
    lines.push('### 角色與權限範圍（待確認）', '');
    m.profile.roles.forEach(role => lines.push(`- **${role.name}**：${role.purpose}`, `  - 需要確認：${role.permissionQuestion}`));
    lines.push('', '### 主要流程示例', '');
    m.profile.journeys.forEach((journey, index) => { lines.push(`#### ${index + 1}. ${journey.title}`, '', ...journey.steps.map((step, stepIndex) => `${stepIndex + 1}. ${step}`), '', `接著可以問：${journey.exception}`, ''); });

    section(3, '功能規格草案');
    lines.push('以下每項均為待釐清問題，討論標記尚未構成正式開發範圍。', '');
    m.features.forEach((feature, index) => {
      const id = `F${String(index + 1).padStart(2, '0')}`, moduleNotes = m.notes.modules[String(index)] || {};
      lines.push(`### ${id} / ${feature.name}`, '', `本次討論標記：${priorityLabels[moduleNotes.priority] || priorityLabels.discuss}`, `說明起點：${m.profile.modulePrompts[index] || '先確認客戶的現行做法與希望改善的事。'}`, '');
      feature.items.forEach((item, itemIndex) => lines.push(`- **${id}.${String(itemIndex + 1).padStart(2, '0')} ${item.name}**［待釐清］`, `  - ${item.desc}`));
      lines.push(''); notes('業務補充／' + feature.name, moduleNotes.note);
    });

    section(4, '資料與串接');
    lines.push('### 資料範圍草案', '');
    m.profile.entities.forEach(entity => lines.push(`- **${entity.name}**：${entity.examples}`, `  - 訪談時要確認：${entity.question}`));
    lines.push('', '### 候選外部服務與系統串接', '', '是否需要、供應商、方案、費用與資料交換方式均未確認。', '');
    m.profile.integrations.forEach(integration => lines.push(`- **${integration.name}**：${integration.purpose}`, `  - 仍需確認：${integration.question}`));
    lines.push('');

    section(5, '例外與驗收');
    lines.push('### 例外情境', '');
    m.profile.exceptions.forEach(item => lines.push(`- **${item.scenario}**`, `  - 可能影響：${item.impact}`, `  - 說明與待確認：${item.discussion}`));
    lines.push('', '### 驗收情境示例', '', '以下為說明方向，正式測試條件、測試資料與驗收標準仍需工程師整理後確認。', '');
    m.profile.acceptance.forEach(item => lines.push(`- **${item.scenario}**`, `  - 操作示例：${item.action}`, `  - 預期方向（示例）：${item.expected}`));
    lines.push('', '### 交付與維運的討論範圍', '');
    m.profile.delivery.forEach(item => lines.push(`- **${item.item}**：${item.discussion}［工程師確認］`));
    lines.push('');

    section(6, '視覺與費用');
    lines.push(`本次展示選擇：**${m.template.name}** / ${m.template.english}`, '', m.template.description, '', '### 可選視覺效果', '');
    if (!m.effects.length) lines.push('本次未選購額外視覺效果。');
    m.effects.forEach(effect => lines.push(`- **${effect.name}**：NT$ ${Number(effect.price).toLocaleString('zh-TW')}（示意整合費）`, `  - 適用方向：${effect.target || '待討論'}`));
    lines.push('', `**效果示意小計：NT$ ${m.subtotal.toLocaleString('zh-TW')}**`, '', '網站與系統開發範圍、第三方服務、素材及維運費用、交付方式與時程，均待工程師評估後確認。', '此小計非整站總價或正式報價，選用記錄不構成訂單或扣款。', '');

    section(7, '訪談紀錄');
    noteFields.forEach(field => notes(field.label, m.notes[field.id]));

    section(8, '工程評估');
    lines.push('**目前狀態：尚未工程評估。**', '', '展示與需求探索 → 業務整理訪談記錄 → 工程師評估與釐清 → 確認範圍與正式估價', '', '### 請工程師接續確認', '', ...m.profile.engineeringChecks.map((item, index) => `${index + 1}. ${item}`), '', '業務可先整理：客戶目的、現行流程、優先事項、內容素材、既有系統，以及對時程與預算的期待。', '', '工程師接續評估：功能與資料規則、權限、串接、例外、測試方式、實作範圍、可行時程與正式費用。', '', '**最終以工程師評估後的規格與估價為主，並與客戶確認實際範圍。此 Demo 不代表工程已承諾或核定。**', '', '由白澤 BAIZE STUDIO 需求工作台整理。本文件為訪談草案。');
    return lines.join('\n');

<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const cases = window.DEMO_CONTENT.cases;
  const FX = window.BaizeEffects;
  const Templates = window.BaizeTemplates;
  const SalesSpec = window.BaizeSalesSpec;
  const Presentation = window.BaizePresentation;
  const STORAGE_KEY = 'baize-refined-brief-v1';
  const steps = ['需求', '生成', '套版與功能', '效果', '摘要'];
  const labels = { fitness: '會員網站', ecommerce: '電商網站', internal: '內部系統' };
  const money = value => Number(value).toLocaleString('zh-TW');
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const state = { presentationId: 'matrix', step: 1, highest: 1, caseId: 'fitness', client: cases[0].defaults.client, need: cases[0].defaults.need, selected: [], templateId: 'matrix', previewTemplateId: 'matrix', templateConfirmed: false, focused: 'spotlight', filter: '全部', activeFeature: null, revealed: 1, reviewed: [], specNotesByCase:{},specPresentation:false,activeSpecSection:'overview' };
  let effectCleanup = () => {};
  let stopMatrix = () => {};
  let generationTimer = 0;
  let toastTimer = 0;
  let featureTrigger = null;
  let generationObserver = null;
  let previewObserver = null;
  let compareOpen = false;
  let compareTrigger = null;
  let entranceSelection = 'matrix';
  let view = 'entrance';

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && cases.some(item => item.id === saved.caseId)) {
      state.caseId = saved.caseId;
      if (Presentation.modes.some(mode => mode.id === saved.presentationId)) state.presentationId = saved.presentationId;
      if (Number.isInteger(saved.highest) && saved.highest >= 1 && saved.highest <= 5) state.highest = saved.highest;
      if ([1,3,4,5].includes(saved.step)) state.step = Math.min(saved.step,state.highest);
      state.client = typeof saved.client === 'string' ? saved.client.slice(0, 60) : currentCase().defaults.client;
      state.need = typeof saved.need === 'string' ? saved.need.slice(0, 1200) : currentCase().defaults.need;
      state.selected = Array.isArray(saved.selected) ? [...new Set(saved.selected.filter(id => FX.catalog.some(item => item.id === id)))] : [];
      if (Templates.catalog.some(item => item.id === saved.templateId)) { state.templateId = saved.templateId; state.previewTemplateId = saved.templateId; state.templateConfirmed = Boolean(saved.templateConfirmed); }
      if(saved.specNotesByCase && typeof saved.specNotesByCase==='object')for(const item of cases)if(saved.specNotesByCase[item.id])state.specNotesByCase[item.id]=normalizeSpecNotes(saved.specNotesByCase[item.id]);
    }
  } catch (_) { /* The demo also works when browser storage is unavailable. */ }

  function currentMode() { return Presentation.modes.find(mode => mode.id === state.presentationId) || Presentation.modes[0]; }
  function modeCopy() { return currentMode().copy; }
  function multiline(value) { return escape(value).replace(/\n/g,'<br>'); }
  function currentCase() { return cases.find(item => item.id === state.caseId) || cases[0]; }
  function selectedEffects() { return FX.catalog.filter(item => state.selected.includes(item.id)); }
  function subtotal() { return selectedEffects().reduce((sum, item) => sum + item.price, 0); }
  function templateMeta(id = state.templateId) { return Templates.catalog.find(item => item.id === id) || Templates.catalog[0]; }
  function normalizeSpecNotes(value={}) {
    const result={modules:{}};
    for(const key of ['general','priority','exclusions','timing','engineering'])result[key]=typeof value[key]==='string'?value[key].slice(0,2000):'';
    for(let index=0;index<4;index++){const item=value.modules?.[index]||{};result.modules[index]={priority:['discuss','later','out'].includes(item.priority)?item.priority:'discuss',note:typeof item.note==='string'?item.note.slice(0,2000):''};}
    return result;
  }
  function specNotes() { return state.specNotesByCase[state.caseId] ||= normalizeSpecNotes(); }
  function specContext() {return {client:state.client,need:state.need,caseId:state.caseId,caseLabel:labels[state.caseId],features:currentCase().features,template:templateMeta(),effects:selectedEffects(),subtotal:subtotal(),notes:specNotes(),presentation:state.specPresentation,activeSection:state.activeSpecSection,presentationId:state.presentationId,presentationName:currentMode().name,specIntro:modeCopy().specIntro,escape};}
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ presentationId:state.presentationId,step:state.step===2?1:state.step,highest:state.highest,caseId: state.caseId, client: state.client, need: state.need, selected: state.selected, templateId:state.templateId, templateConfirmed:state.templateConfirmed,specNotesByCase:state.specNotesByCase })); return true; } catch (_) { return false; }
  }
  function announce(message) {
    const toast = document.getElementById('toast');
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('is-visible');
    toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2600);
  }
  function cleanWorkspace() {
    closeComparison(false);
    dismissFeature(false);
    clearInterval(generationTimer);
    generationObserver?.disconnect(); generationObserver = null;
    previewObserver?.disconnect(); previewObserver = null;
    effectCleanup(); effectCleanup = () => {};
    stopMatrix(); stopMatrix = () => {};
  }
  function showEntrance(options = {}) {
    cleanWorkspace();
    view = 'entrance'; entranceSelection = state.presentationId;
    document.body.dataset.view = 'entrance';
    document.body.dataset.presentation = 'entrance';
    document.body.dataset.theme = 'light';
    delete document.body.dataset.step;

  }
  function renderEntrance() {
    app.innerHTML = Presentation.renderEntrance(entranceSelection,{resume:state.highest>1,escape});
    document.getElementById('steps').innerHTML = '';
    const switcher=document.getElementById('presentation-switch');
    switcher.hidden=true;
  }
  function enterPresentation() {
    const mode=Presentation.modes.find(item=>item.id===entranceSelection);
    if(!mode)return;
    state.presentationId=mode.id;
    if(!state.templateConfirmed){state.templateId=mode.defaultTemplate;state.previewTemplateId=mode.defaultTemplate;}
    navigate(state.step===2?1:state.step);
  }
  function navigate(step, options = {}) {
    cleanWorkspace();
    view = 'workflow';
    const mode = currentMode();
    const stepLabels = mode.stepLabels || steps;
    document.body.dataset.view = 'workflow';
    document.body.dataset.presentation = mode.id;

    switcher.hidden=false; switcher.innerHTML=escape(mode.name)+'<span>切換版本 ↗</span>';

    if (step === 3 && state.step !== 3 && state.templateConfirmed) state.previewTemplateId = state.templateId;
    state.step = step;
    state.highest = Math.max(state.highest, step);

    }).join('');
    app.innerHTML = [inputScreen, generationScreen, scopeScreen, effectsScreen, summaryScreen][step - 1]();

  function startGeneration() {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    mountPreviewFrames(app);
    const start = performance.now();
    const update = () => {
      const progress = Math.min(1, (performance.now() - start) / duration);
      const percent = Math.floor(progress * 100);
      const active = Math.min(3, Math.floor(progress * 4));
      document.getElementById('progress-fill').style.width = percent + '%';
      document.getElementById('progress-number').textContent = percent + '%';
      document.getElementById('gen-progress').setAttribute('aria-valuenow', String(percent));
      document.querySelectorAll('[data-gen-step]').forEach((item, i) => {

      });
      let completed=0;
      document.querySelectorAll('[data-generation-template]').forEach((item,index)=>{const built=progress> .12+index*.17;item.classList.toggle('is-built',built);item.querySelector('.variant-ready').textContent=state.presentationId==='matrix'?(built?'READY':'BUILDING'):(built?'已準備':'準備中');if(built)completed++;});

    };

  }

  function mountMatrix(canvas) {
    if (!canvas) return () => {};
    const context = canvas.getContext('2d');
    if (!context) return () => {};
    const glyphs = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ0123456789';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let width = 0, height = 0, drops = [], frame = 0, last = 0;
    function size() {
      const bounds = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = bounds.width; height = bounds.height;
      canvas.width = width * dpr; canvas.height = height * dpr;
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      drops = Array.from({ length: Math.ceil(width / 21) }, () => Math.random() * height / 18);
      for (let i = 0; i < 70; i++) draw();
    }
    function draw() {
      context.fillStyle = 'rgba(2,10,5,.09)'; context.fillRect(0, 0, width, height);
      context.font = '15px monospace';
      drops.forEach((drop, i) => {
        context.fillStyle = '#00c853';
        context.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * 21, (drop - 1) * 18);
        context.fillStyle = i % 3 === 0 ? '#d8ffe6' : '#00ff66';
        context.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * 21, drop * 18);
        drops[i] = drop * 18 > height && Math.random() > .965 ? -1 : drop + .7;
      });
    }
    const tick = now => {
      frame = requestAnimationFrame(tick);
      if (now - last < 60 || document.hidden) return;
      last = now; draw();
    };
    size();
    const observer = new ResizeObserver(size); observer.observe(canvas);
    if (!reduced && state.step !== 3) frame = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(frame); observer.disconnect(); };
  }

  document.addEventListener('click', event => {
    if (event.target.closest('.wordmark') || event.target.closest('#presentation-switch')) { event.preventDefault(); showEntrance(); return; }
    if (event.target.closest('#reset-button')) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) { /* Storage is optional. */ }
      Object.assign(state, { step: 1, highest: 1, caseId: 'fitness', client: cases[0].defaults.client, need: cases[0].defaults.need, selected: [], templateId:currentMode().defaultTemplate,previewTemplateId:currentMode().defaultTemplate,templateConfirmed:false,focused: 'spotlight', filter: '全部', activeFeature: null, revealed: 1, reviewed: [],specNotesByCase:{},specPresentation:false,activeSpecSection:'overview' });
      navigate(1); announce('已重新開始，效果選擇已清空。'); return;
    }
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const action = button.dataset.action;
    if(action==='select-presentation'&&view==='entrance'){const id=button.dataset.presentation;if(Presentation.modes.some(mode=>mode.id===id)){entranceSelection=id;const scroll=window.scrollY;renderEntrance();window.scrollTo({top:scroll,behavior:'instant'});app.querySelector('[data-action="select-presentation"][data-presentation="'+id+'"]')?.focus({preventScroll:true});}return;}
    if(action==='enter-presentation'&&view==='entrance'){enterPresentation();return;}
    if(action==='show-entrance'){showEntrance();return;}
    if(action==='spec-presentation'){state.specPresentation=!state.specPresentation;updateSpecView(true);announce(state.specPresentation?'已切換為逐節說明，可用上一節、下一節導覽。':'已展開完整需求規格草案。');}
    if(action==='spec-section'&&window.BaizeSpecData.sections.some(section=>section.id===button.dataset.section)){state.activeSpecSection=button.dataset.section;updateSpecView(true);}
    if(action==='spec-prev'||action==='spec-next'){const sections=window.BaizeSpecData.sections,index=sections.findIndex(section=>section.id===state.activeSpecSection);state.activeSpecSection=sections[Math.max(0,Math.min(sections.length-1,index+(action==='spec-next'?1:-1)))].id;updateSpecView(true);}
    if(action==='spec-export-html')downloadSpecHTML();
    if (action === 'compare-templates') openComparison(button);
    if (action === 'close-comparison') closeComparison();
    if (action === 'preview-template') switchTemplate(button.dataset.template,false,true);
    if (action === 'choose-template') switchTemplate(button.dataset.template,true,false);
    if (action === 'choose-and-continue') {
      const id=button.dataset.template;
      if(Templates.catalog.some(item=>item.id===id)){state.templateId=id;state.previewTemplateId=id;state.templateConfirmed=true;save();navigate(4);}
    }
    if (action === 'download-demo') downloadDemo(button.dataset.template || state.templateId);
    if (action === 'navigate') { const step = Number(button.dataset.step); if (step >= 1 && step <= 5 && step !== 2) navigate(step); }
    if (action === 'case') {
      const previous = currentCase();
      state.caseId = button.dataset.case;
      const next = currentCase();
      if (state.client === previous.defaults.client || !state.client.trim()) state.client = next.defaults.client;
      if (state.need === previous.defaults.need || !state.need.trim()) state.need = next.defaults.need;
      state.reviewed = []; navigate(1); app.querySelector(`[data-case="${state.caseId}"]`).focus({ preventScroll: true });
    }
    if (action === 'example') { state.client = currentCase().defaults.client; state.need = currentCase().defaults.need; navigate(1); announce('已帶入' + labels[state.caseId] + '範例。'); }
    if (action === 'skip-generation') navigate(3);
    if (action === 'feature') {
      openFeature(Number(button.dataset.feature), button);
    }
    if (action === 'close-feature') dismissFeature();
    if (action === 'next-detail' && state.activeFeature !== null) {
      state.revealed = Math.min(state.revealed + 1, currentCase().features[state.activeFeature].items.length);
      renderFeatureDialog();
      document.querySelector('.mx-feature-dialog [data-action="next-detail"],.mx-feature-dialog .primary')?.focus({ preventScroll: true });
    }
    if (action === 'reveal-all' && state.activeFeature !== null) {
      state.revealed = currentCase().features[state.activeFeature].items.length;
      renderFeatureDialog();
      document.querySelector('.mx-feature-dialog .primary').focus({ preventScroll: true });
    }
    if (action === 'filter') {
      state.filter = button.dataset.filter;
      const scroll = window.scrollY; navigate(4, { initial: true }); window.scrollTo({ top: scroll, behavior: 'instant' });
      app.querySelector(`.filter[data-filter="${state.filter}"]`).focus({ preventScroll: true });
    }
    if (action === 'toggle-effect') {
      const id = button.dataset.effect;
      if (!FX.catalog.some(item => item.id === id)) return;
      const selected = state.selected.includes(id);
      state.selected = selected ? state.selected.filter(item => item !== id) : [...state.selected, id];
      if (!selected) state.focused = id;
      refreshEffectSelection(); save();
      if (button.classList.contains('order-remove')) { const heading = document.querySelector('.order-header'); heading.setAttribute('tabindex', '-1'); heading.focus({ preventScroll: true }); }
      announce((selected ? '已移除' : '已加入') + FX.catalog.find(item => item.id === id).name + '，效果小計 NT$ ' + money(subtotal()));
    }
    if (action === 'preview-effect') { state.focused = button.dataset.effect; refreshPreview(); if (window.innerWidth < 780) document.getElementById('preview-panel').scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    if (action === 'replay') { const host = app.querySelector('.live-preview-stage .fx-demo'); if (host) { host.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: host.getBoundingClientRect().left + host.clientWidth/2, clientY: host.getBoundingClientRect().top + host.clientHeight/2 })); host.focus({ preventScroll: true }); } }
    if (action === 'download') downloadBrief();
  });
  document.addEventListener('keydown', event => {
    if(compareOpen){
      if(event.key==='Escape'){event.preventDefault();closeComparison();}
      if(event.key==='Tab'){
        const nodes=Array.from(document.querySelectorAll('#template-compare button')).filter(node=>!node.disabled&&node.getClientRects().length),first=nodes[0],last=nodes[nodes.length-1];
        if(event.shiftKey && (document.activeElement===first||!nodes.includes(document.activeElement))){event.preventDefault();last?.focus();}
        else if(!event.shiftKey && (document.activeElement===last||!nodes.includes(document.activeElement))){event.preventDefault();first?.focus();}
      }
      return;
    }
    if (state.activeFeature !== null) {
      if (event.key === 'Escape') { event.preventDefault(); dismissFeature(); }
      if (event.key === 'Tab') {
        const focusable = Array.from(document.querySelectorAll('.mx-feature-dialog button,.mx-feature-dialog a')).filter(item => !item.disabled && item.getClientRects().length);
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && (document.activeElement === first || !focusable.includes(document.activeElement))) { event.preventDefault(); last?.focus(); }
        else if (!event.shiftKey && (document.activeElement === last || !focusable.includes(document.activeElement))) { event.preventDefault(); first?.focus(); }
      }
      return;
    }
    const target = event.target.closest('[role="button"][data-action="feature"]');
    if (target && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); target.click(); }
  });
  window.addEventListener('resize', positionFeatureDialog);
  window.addEventListener('pagehide', () => { effectCleanup(); stopMatrix(); clearInterval(generationTimer); generationObserver?.disconnect(); previewObserver?.disconnect(); });
  showEntrance({ initial: true });
}());

</script>
</body>
</html>
